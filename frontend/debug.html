<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Data Source Debug</title>
  <style>
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      margin: 24px;
      background: #0d1117;
      color: #d1d7e0;
    }
    h1 {
      margin-top: 0;
    }
    section {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    h2 {
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 14px;
      color: #7dd3fc;
    }
    pre {
      margin: 0;
      padding: 12px;
      border-radius: 8px;
      background: rgba(15,23,42,0.9);
      overflow-x: auto;
      font-size: 13px;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 6px;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <h1>Data Source Debug</h1>
  <p>This page dumps the latest payloads feeding the dashboard for quick inspection.</p>
  <button id="clear-cache" style="margin-bottom:16px;padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);background:#1f2937;color:#d1d7e0;cursor:pointer;">Clear cache</button>
  <section id="sources"></section>
  <section id="panels"></section>
  <section id="earth"></section>

  <script>
    const sources = document.getElementById("sources");
    const panels = document.getElementById("panels");
    const earth = document.getElementById("earth");

    const apiBase = () => (window.location.protocol === "file:" ? "http://127.0.0.1:8000" : "");

    const expose = (container, title, badge, data) => {
      const section = document.createElement("div");
      const heading = document.createElement("h2");
      heading.textContent = title;
      if (badge) {
        const span = document.createElement("span");
        span.className = "badge";
        span.textContent = badge;
        heading.appendChild(span);
      }
      section.appendChild(heading);
      const pre = document.createElement("pre");
      pre.textContent = data ? JSON.stringify(data, null, 2) : "(no data)";
      section.appendChild(pre);
      container.appendChild(section);
    };

    async function load() {
      try {
        const [statusResp, panelsResp] = await Promise.all([
          fetch(`${apiBase()}/api/status`),
          fetch(`${apiBase()}/api/panels`),
        ]);
        const status = await statusResp.json();
        const panelsConfig = await panelsResp.json();

        expose(panels, "Panel configuration", null, panelsConfig);

        const dataSources = status.data_sources || {};
        expose(sources, "Data sources map", null, dataSources);

        const entries = [
          { label: "Sun", key: "sun", data: status.sun },
          { label: "Space weather", key: "space_weather", data: status.space_weather },
          { label: "Solar image", key: "solar_image", data: status.sun?.images?.[0] || null },
          { label: "Maunakea", key: "maunakea", data: status.maunakea },
          { label: "Moon info", key: "moon", data: status.observing_index?.moon_info || null },
          { label: "Observing index", key: "observing_index", data: status.observing_index },
        ];
        for (const entry of entries) {
          expose(
            sources,
            entry.label,
            entry.key ? dataSources[entry.key] || null : null,
            entry.data
          );
        }

        expose(sources, "Alerts", null, status.alerts);

        try {
          const earthResp = await fetch(`${apiBase()}/api/earth/loop`);
          const earthData = await earthResp.json();
          expose(earth, "Earth loop frames", `${earthData.length || 0} frames`, earthData);
        } catch (earthErr) {
          expose(earth, "Earth loop frames", "error", { error: String(earthErr) });
        }
      } catch (err) {
        expose(sources, "Error", "failed", { error: String(err) });
      }
    }

    document.getElementById("clear-cache").addEventListener("click", async () => {
      try {
        await fetch(`${apiBase()}/api/cache/clear`, { method: "POST" });
        sources.innerHTML = "";
        panels.innerHTML = "";
        earth.innerHTML = "";
        await load();
      } catch (err) {
        expose(sources, "Cache clear failed", "error", { error: String(err) });
      }
    });

    load();
  </script>
</body>
</html>
