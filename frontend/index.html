<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hawai‘i Space & Sky Dashboard</title>
  <style>
    :root {
      --bg: #0c111d;
      --panel: #141c2d;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e6edf7;
      --muted: #9bb1d8;
      --sun: #f7a541;
      --space: #54b6f8;
      --ground: #6be0c2;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 20%, #14213a 0, #0c111d 40%), #0c111d;
      color: var(--text);
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .page {
      width: 100%;
      display: grid;
      gap: 14px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.6px;
    }
    header .updated {
      font-size: 14px;
      color: var(--muted);
    }
    .panel.now-alert-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 12px;
      width: 100%;
      align-items: start;
      min-height: auto;
    }
    .panel.now-alert-row .nowcast,
    .panel.now-alert-row .alerts {
      height: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .panel.now-alert-row .nowcast {
      background: linear-gradient(90deg, rgba(84,182,248,0.1), rgba(107,224,194,0.1));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
      font-size: 15px;
      color: #dfe9fb;
      box-sizing: border-box;
    }
    .panels {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
      width: 100%;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 200px;
      width: 100%;
      box-sizing: border-box;
    }
    .two-col {
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }
    .full-width {
      width: 100%;
      grid-column: 1 / -1;
    }
    .panel h2 {
      margin: 0;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tag {
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 12px;
      color: #0c111d;
      font-weight: 700;
    }
    .tag.sun { background: var(--sun); }
    .tag.space { background: var(--space); }
    .tag.ground { background: var(--ground); }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 6px 12px;
    }
    .observing-layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .observing-layout .info-block {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .metric:last-child { border-bottom: none; }
    .metric span.label {
      color: var(--muted);
      font-size: 13px;
    }
    .metric span.value {
      font-weight: 700;
      font-size: 17px;
    }
    .summary {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 12px 14px;
      color: #dbe7ff;
      line-height: 1.5;
    }
    .observing-layout .info-block .summary {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .status-line {
      font-size: 13px;
      color: var(--muted);
      margin-top: auto;
    }
    .sky-image,
    .solar-image,
    .earth-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #0f1b35;
      display: block;
      transition: opacity 1.5s ease;
    }
    .sun-image-stack {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
    }
    .sun-image-stack img {
      position: absolute;
      inset: 0;
    }
    ul.notes {
      padding-left: 18px;
      color: #d3def6;
      margin: 6px 0 0 0;
    }
    .unavailable {
      color: var(--muted);
      font-style: italic;
      padding: 6px 0;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 14px;
    }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    .panel.now-alert-row .alerts {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0;
      background: none;
      border: none;
      box-shadow: none;
    }
    .panel.now-alert-row .alert-card {
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .panel.now-alert-row .alert-card h3 {
      margin: 0 0 4px 0;
      font-size: 15px;
    }
    .panel.now-alert-row .alert-card p {
      margin: 0;
      color: #d8e1f5;
      font-size: 14px;
      line-height: 1.4;
    }
    .panel.now-alert-row .alert-info { background: rgba(107, 224, 194, 0.08); border-color: rgba(107,224,194,0.35); }
    .panel.now-alert-row .alert-warning { background: rgba(247, 165, 65, 0.12); border-color: rgba(247,165,65,0.4); }
    .panel.now-alert-row .alert-alert { background: rgba(220, 38, 38, 0.18); border-color: rgba(220,38,38,0.5); }
    .history-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .chip {
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
    }
    .chip.active {
      border-color: var(--space);
      color: var(--space);
      background: rgba(84,182,248,0.12);
    }
    .chart {
      width: 100%;
      height: 180px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
    }
    .chart svg {
      width: 100%;
      height: 100%;
    }
    .source {
      font-size: 12px;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-left: 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge.real { color: #6be0c2; border-color: rgba(107,224,194,0.5); }
    .badge.cache { color: #f7a541; border-color: rgba(247,165,65,0.5); }
    .badge.demo { color: #9bb1d8; }
    .badge.unavailable { color: #7f8eaa; border-color: rgba(127,142,170,0.5); }
    .stale-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f7a541;
      margin-left: 6px;
    }
    .placeholder-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
      background: rgba(255,255,255,0.02);
      margin: 4px 0 6px 0;
    }
    .carousel {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      display: block;
    }
    .carousel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .carousel .controls {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
      padding: 0 6px;
      pointer-events: none;
    }
    .carousel button {
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.15);
      color: #e6edf7;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      cursor: pointer;
      pointer-events: auto;
    }
    .carousel .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
    }
    /* Full-screen image modal */
    .fullscreen-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: zoom-out;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .fullscreen-modal.active {
      display: flex;
      opacity: 1;
    }
    .fullscreen-modal img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }
    .fullscreen-modal .close-button {
      position: fixed;
      top: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
      backdrop-filter: blur(10px);
      transition: background 0.2s ease;
    }
    .fullscreen-modal .close-button:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    .sky-image,
    .solar-image,
    .earth-image {
      cursor: zoom-in;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Hawai‘i Space & Sky Dashboard</h1>
      <div class="controls">
        <span class="updated" id="updated-at" title="Time the dashboard’s data was last refreshed.">Last updated —</span>
      </div>
    </header>

    <div class="panel" data-panel-slot="panel-now"></div>

    <div class="panels" id="panel-grid">
      <div class="panel" data-panel-slot="panel-1"></div>
      <div class="panel" data-panel-slot="panel-2"></div>
      <div class="panel" data-panel-slot="panel-3"></div>
    </div>

    <div class="panels two-col">
      <div class="panel" data-panel-slot="panel-observing"></div>
    </div>

  </div>

  <!-- Full-screen image modal -->
  <div class="fullscreen-modal" id="fullscreen-modal">
    <button class="close-button" aria-label="Close fullscreen">&times;</button>
    <img src="" alt="">
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
